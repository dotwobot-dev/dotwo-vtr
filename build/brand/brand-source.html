<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    html, body {
      margin: 0;
      width: 1800px;
      height: 900px;
      background: transparent;
      font-family: Inter, Arial Black, system-ui, sans-serif;
    }

    .logo {
      position: relative;
      width: 1800px;
      height: 900px;
      background: transparent;
    }

    .screen {
      position: absolute;
      left: 810px;
      top: 120px;
      width: 720px;
      height: 380px;
      border-radius: 44px;
      background: linear-gradient(160deg, #101c32, #030814);
      border: 14px solid #0879ff;
      box-shadow: 0 18px 0 #062061, 0 0 34px #2fb5ff, inset 0 0 28px rgba(255,255,255,.18);
    }

    .screen::before {
      content: "";
      position: absolute;
      inset: 42px;
      border-radius: 22px;
      border: 5px solid rgba(101,199,255,.42);
    }

    .play {
      position: absolute;
      left: 310px;
      top: 132px;
      width: 0;
      height: 0;
      border-top: 70px solid transparent;
      border-bottom: 70px solid transparent;
      border-left: 112px solid #42ff82;
      filter: drop-shadow(0 0 18px #43ff83) drop-shadow(0 8px 0 #063d22);
    }

    .bars {
      position: absolute;
      left: 488px;
      top: 120px;
      width: 130px;
      height: 170px;
      display: grid;
      gap: 18px;
    }

    .bars span {
      display: block;
      border-radius: 999px;
      background: #42ff82;
      box-shadow: 0 0 16px #43ff83;
    }

    .word {
      position: absolute;
      left: 120px;
      top: 250px;
      font-size: 286px;
      line-height: 0.86;
      font-weight: 1000;
      color: #28a8ff;
      letter-spacing: 0;
      text-shadow:
        0 8px 0 #073795,
        0 16px 0 #031c5f,
        0 0 0 #fff,
        -5px -5px 0 #83dbff,
        5px 5px 0 #005bea,
        0 0 32px rgba(30,144,255,.75);
    }

    .sub {
      position: absolute;
      left: 240px;
      top: 650px;
      font-size: 96px;
      font-weight: 1000;
      color: #28a8ff;
      text-shadow:
        0 5px 0 #073795,
        -2px -2px 0 #83dbff,
        2px 2px 0 #005bea,
        0 0 18px rgba(30,144,255,.75);
    }

    .dash {
      position: absolute;
      top: 704px;
      width: 230px;
      height: 22px;
      border-radius: 999px;
      background: linear-gradient(90deg, #0583ff, #67d6ff);
      box-shadow: 0 5px 0 #073795, 0 0 16px #27a8ff;
    }

    .dash.left { left: 70px; }
    .dash.right { right: 70px; }

    .cap {
      position: absolute;
      left: 76px;
      top: 94px;
      width: 610px;
      height: 270px;
      transform: rotate(-6deg);
      filter: drop-shadow(0 16px 12px rgba(0,0,0,.42));
    }

    .cap-crown {
      position: absolute;
      left: 50px;
      top: 12px;
      width: 430px;
      height: 190px;
      border-radius: 58% 48% 36% 42%;
      background:
        radial-gradient(circle at 35% 10%, rgba(255,255,255,.24), transparent 18%),
        repeating-linear-gradient(10deg, rgba(255,255,255,.08) 0 4px, transparent 4px 14px),
        linear-gradient(155deg, #0f2c66, #071329 70%);
      border: 8px solid #113f8e;
      box-shadow: inset 0 -22px 34px rgba(0,0,0,.42), inset 0 18px 18px rgba(111,190,255,.12);
    }

    .cap-band {
      position: absolute;
      left: 42px;
      top: 150px;
      width: 455px;
      height: 48px;
      border-radius: 999px;
      background: linear-gradient(180deg, #174a9a, #06142c);
      border: 6px solid #0d377d;
    }

    .cap-bill {
      position: absolute;
      left: 338px;
      top: 144px;
      width: 246px;
      height: 82px;
      border-radius: 8% 92% 58% 42%;
      background:
        repeating-linear-gradient(8deg, rgba(255,255,255,.08) 0 3px, transparent 3px 12px),
        linear-gradient(155deg, #123b7e, #050b17);
      border: 7px solid #0b3173;
      transform: rotate(8deg);
    }
  </style>
</head>
<body>
  <div class="logo">
    <div class="screen">
      <div class="play"></div>
      <div class="bars"><span></span><span></span><span></span></div>
    </div>
    <div class="word">DoTwo</div>
    <div class="sub">VTR</div>
    <div class="dash left"></div>
    <div class="dash right"></div>
    <div class="cap">
      <div class="cap-crown"></div>
      <div class="cap-band"></div>
      <div class="cap-bill"></div>
    </div>
  </div>
</body>
</html>
