<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    html, body {
      margin: 0;
      width: 1024px;
      height: 1024px;
      background: #07101d;
      font-family: Inter, Arial Black, system-ui, sans-serif;
    }

    .icon {
      position: relative;
      width: 1024px;
      height: 1024px;
      border-radius: 188px;
      background: linear-gradient(160deg, #101b32, #030714 72%);
      border: 18px solid #0879ff;
      box-shadow: inset 0 0 32px rgba(255,255,255,.24), 0 22px 0 #031b5c, 0 0 42px #098cff;
      overflow: hidden;
    }

    .screen {
      position: absolute;
      left: 202px;
      top: 172px;
      width: 620px;
      height: 290px;
      border-radius: 44px;
      background: #071223;
      border: 10px solid #138cff;
      box-shadow: inset 0 0 24px rgba(255,255,255,.22), 0 10px 0 #04226d;
    }

    .play {
      position: absolute;
      left: 258px;
      top: 86px;
      width: 0;
      height: 0;
      border-top: 58px solid transparent;
      border-bottom: 58px solid transparent;
      border-left: 94px solid #42ff82;
      filter: drop-shadow(0 0 18px #43ff83) drop-shadow(0 8px 0 #063d22);
    }

    .letters {
      position: absolute;
      left: 112px;
      top: 475px;
      font-size: 244px;
      line-height: .82;
      font-weight: 1000;
      color: #28a8ff;
      letter-spacing: 0;
      text-shadow:
        0 9px 0 #073795,
        0 17px 0 #031c5f,
        -5px -5px 0 #83dbff,
        5px 5px 0 #005bea,
        0 0 30px rgba(30,144,255,.78);
    }

    .progress {
      position: absolute;
      left: 170px;
      right: 170px;
      bottom: 96px;
      height: 52px;
      border-radius: 999px;
      border: 8px solid #0879ff;
      background: #020915;
      box-shadow: inset 0 0 12px rgba(255,255,255,.22), 0 8px 0 #031b5c;
    }

    .progress::after {
      content: "";
      position: absolute;
      left: 34px;
      right: 34px;
      top: 14px;
      height: 14px;
      border-radius: 999px;
      background: #42ff82;
      box-shadow: 0 0 18px #42ff82;
    }

    .cap {
      position: absolute;
      left: 78px;
      top: 58px;
      width: 500px;
      height: 230px;
      transform: rotate(-8deg);
      filter: drop-shadow(0 14px 10px rgba(0,0,0,.45));
    }

    .cap-crown {
      position: absolute;
      left: 30px;
      top: 8px;
      width: 350px;
      height: 160px;
      border-radius: 58% 48% 36% 42%;
      background:
        radial-gradient(circle at 35% 8%, rgba(255,255,255,.24), transparent 18%),
        repeating-linear-gradient(10deg, rgba(255,255,255,.08) 0 4px, transparent 4px 13px),
        linear-gradient(155deg, #0f2c66, #071329 70%);
      border: 7px solid #113f8e;
      box-shadow: inset 0 -20px 28px rgba(0,0,0,.42), inset 0 16px 16px rgba(111,190,255,.12);
    }

    .cap-band {
      position: absolute;
      left: 26px;
      top: 126px;
      width: 374px;
      height: 42px;
      border-radius: 999px;
      background: linear-gradient(180deg, #174a9a, #06142c);
      border: 5px solid #0d377d;
    }

    .cap-bill {
      position: absolute;
      left: 286px;
      top: 120px;
      width: 192px;
      height: 68px;
      border-radius: 8% 92% 58% 42%;
      background:
        repeating-linear-gradient(8deg, rgba(255,255,255,.08) 0 3px, transparent 3px 11px),
        linear-gradient(155deg, #123b7e, #050b17);
      border: 6px solid #0b3173;
      transform: rotate(8deg);
    }
  </style>
</head>
<body>
  <div class="icon">
    <div class="screen"><div class="play"></div></div>
    <div class="letters">VTR</div>
    <div class="progress"></div>
    <div class="cap">
      <div class="cap-crown"></div>
      <div class="cap-band"></div>
      <div class="cap-bill"></div>
    </div>
  </div>
</body>
</html>
